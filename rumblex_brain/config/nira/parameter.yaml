node_brain:
  ros__parameters:
    robot: nira
    autostart_listening: false
    activate_movement_waiting: false
    max_velocity_linear: 0.10
    max_velocity_rotation: 0.40  # rad/s, about 23 deg/s at full stick
    body_factor_height: 0.04
    min_body_height: -0.04
    max_body_height: 0.10
    joystick_deadzone: 0.04
    supply_voltage: 11.1
    supply_voltage_low: 10.5
    supply_voltage_critical_low: 10.1
    servo_voltage: 11.1
    servo_voltage_low: 10.5
    servo_voltage_critical_low: 10.1
    servo_temperature_high: 70.0
    servo_temperature_critical_high: 75.0
    # Offline desktop preview only; physical face tracking is not commissioned.
    face_tracking.max_yaw_deg: 30.0
    face_tracking.max_pitch_deg: 20.0
    face_tracking.max_speed_deg_s: 25.0
    face_tracking.acceleration_deg_s2: 60.0
    face_tracking.gain: 3.0
    face_tracking.deadband_deg: 0.5
