# Raise the right-front leg, hold it for a high five, then restore the starting pose.
# Start standing; this sequence does not run standup first.
name: high_five
trigger:
  joystick: button_b
  voice: commandHighFive
variables:
  kMoveDuration: &kMoveDuration 1.0  # s
  kHoldDuration: &kHoldDuration 2.0  # s
  kRaisedLeg: &kRaisedLeg {torso_coxa: -25, coxa_femur: 50, femur_tibia: 60}  # deg for each joint
actions:
  - say: Ich gebe dir ein High Five
    movement:
      name: SINGLE_POSE
      duration_s: *kMoveDuration
      save_pose: true  # Capture the pose before this movement begins.
      body_pose:
        head_orientation: {yaw: 0, pitch: -20}
        torso_pose: {orientation: {pitch: -8}}
      joint_targets:
        right_front: *kRaisedLeg
  - movement:
      name: SINGLE_POSE
      duration_s: *kHoldDuration
      # An empty relative translation holds the raised pose for the requested duration.
      pose_delta: {torso_translation: {}}
  - movement:
      name: SINGLE_POSE
      duration_s: *kMoveDuration
      restore_pose: true  # Return to the captured pose on normal completion.
