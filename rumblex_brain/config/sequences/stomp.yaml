name: stomp
# Suggested gesture; start standing. No automatic voice or joystick trigger.
actions:
  - say:
      text: "Nein"
    movement:
      name: SINGLE_POSE
      duration_s: 0.5
      save_pose: true
      pose_delta:
        toe_translation: {right_front: {z: 0.02}}
  - movement:
      name: SINGLE_POSE
      duration_s: 0.1
      pose_delta:
        toe_translation: {right_front: {z: -0.04}}
  - movement:
      name: SINGLE_POSE
      duration_s: 1.0
      restore_pose: true
