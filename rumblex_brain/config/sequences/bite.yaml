# Lean the torso forward and pitch the head, then restore the starting pose.
name: bite
# Suggested gesture; start standing. No automatic voice or joystick trigger.
variables:
  kMoveDuration: &kMoveDuration 1.0  # s
  kForwardTorso: &kForwardTorso 0.015  # m
  kHeadPitch: &kHeadPitch 10  # deg
actions:
  - movement:
      name: SINGLE_POSE
      duration_s: *kMoveDuration
      save_pose: true  # Capture the pose before this movement begins.
      pose_delta:
        torso_translation: {x: *kForwardTorso}
        head_rotation: {pitch: *kHeadPitch}
  - movement:
      name: SINGLE_POSE
      duration_s: *kMoveDuration
      restore_pose: true  # Return to the captured pose on normal completion.
