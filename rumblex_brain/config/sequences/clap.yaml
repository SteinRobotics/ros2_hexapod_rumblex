# Start standing on level ground. Keep both middle and both rear toes planted.
# Absolute targets avoid accumulated offsets; no support-foot stepping is needed.
name: clap
trigger:
  voice: commandClap
variables:
  kMovement: &kMovement SINGLE_POSE
  kInterpolation: &kInterpolation sin_squared
  kClapCount: &kClapCount 6  # repetitions
  kSettleDuration: &kSettleDuration 2.0  # s
  kLiftDuration: &kLiftDuration 1.6  # s
  kCloseDuration: &kCloseDuration 1.0  # s
  kOpenDuration: &kOpenDuration 1.2  # s
  kLandDuration: &kLandDuration 2.0  # s
  kReturnDuration: &kReturnDuration 2.0  # s
  kTorsoBack: &kTorsoBack -0.065  # m; retain this rearward bias until front toes land
  kTorsoLow: &kTorsoLow -0.010  # m
  kTorsoPulse: &kTorsoPulse -0.013  # m; gentle 3 mm downward pulse on each clap
  kFrontFemur: &kFrontFemur 50  # deg
  kFrontTibia: &kFrontTibia 90  # deg
  kCoxaOpen: &kCoxaOpen 0  # deg
  kCoxaRightClosed: &kCoxaRightClosed -30  # deg
  kCoxaLeftClosed: &kCoxaLeftClosed 30  # deg
actions:
  # Level the torso and move back with all six toes on the ground. Do not add
  # forward sway or pitch: the middle toes form the forward support boundary.
  - movement:
      name: *kMovement
      duration_s: *kSettleDuration
      interpolation: *kInterpolation
      body_pose:
        torso_pose:
          position: {x: *kTorsoBack, y: 0, z: *kTorsoLow}
          orientation: {roll: 0, pitch: 0, yaw: 0}
  # Save AFTER settling: restoration then lands the front toes while the torso
  # stays rearward. Support toes are omitted and remain fixed in the ground frame.
  - movement:
      name: *kMovement
      duration_s: *kLiftDuration
      interpolation: *kInterpolation
      save_pose: true
      joint_targets:
        right_front: {torso_coxa: *kCoxaOpen, coxa_femur: *kFrontFemur, femur_tibia: *kFrontTibia}
        left_front: {torso_coxa: *kCoxaOpen, coxa_femur: *kFrontFemur, femur_tibia: *kFrontTibia}
  # Slow eased claps with a small body pulse. Repeat absolute front joint targets
  # so the raised legs follow the torso; all four support toes stay planted.
  - loop:
      times: *kClapCount
      actions:
        - movement:
            name: *kMovement
            duration_s: *kCloseDuration
            interpolation: *kInterpolation
            body_pose:
              torso_pose:
                position: {x: *kTorsoBack, y: 0, z: *kTorsoPulse}
                orientation: {roll: 0, pitch: 0, yaw: 0}
            joint_targets:
              right_front: {torso_coxa: *kCoxaRightClosed, coxa_femur: *kFrontFemur, femur_tibia: *kFrontTibia}
              left_front: {torso_coxa: *kCoxaLeftClosed, coxa_femur: *kFrontFemur, femur_tibia: *kFrontTibia}
        - movement:
            name: *kMovement
            duration_s: *kOpenDuration
            interpolation: *kInterpolation
            body_pose:
              torso_pose:
                position: {x: *kTorsoBack, y: 0, z: *kTorsoLow}
                orientation: {roll: 0, pitch: 0, yaw: 0}
            joint_targets:
              right_front: {torso_coxa: *kCoxaOpen, coxa_femur: *kFrontFemur, femur_tibia: *kFrontTibia}
              left_front: {torso_coxa: *kCoxaOpen, coxa_femur: *kFrontFemur, femur_tibia: *kFrontTibia}
  # Land before moving the torso forward. The saved pose has the original toes
  # and head, but the settled rearward torso, so this cannot recenter in mid-air.
  - movement:
      name: *kMovement
      duration_s: *kLandDuration
      interpolation: *kInterpolation
      restore_pose: true
  - movement:
      name: *kMovement
      duration_s: *kReturnDuration
      interpolation: *kInterpolation
      body_pose:
        torso_pose:
          position: {x: 0, y: 0, z: 0}
          orientation: {roll: 0, pitch: 0, yaw: 0}
