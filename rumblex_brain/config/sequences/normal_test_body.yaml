name: normal_test_body
trigger:
  joystick: dpad_horizontal_right
  voice: commandTestBody
actions:
  - say: teste x Richtung
    body_pose:
      duration_s: 2.0
      torso_pose:
        position: {x: 0.05, y: 0.0, z: 0.0}
  - say: teste y Richtung
    body_pose:
      duration_s: 2.0
      torso_pose:
        position: {x: 0.0, y: 0.05, z: 0.0}
  - say: teste z Richtung
    body_pose:
      duration_s: 2.0
      torso_pose:
        position: {x: 0.0, y: 0.0, z: 0.03}
  - say: teste rollen
    body_pose:
      duration_s: 2.0
      torso_pose:
        orientation: {roll: 15.0, pitch: 0.0, yaw: 0.0}
  - say: teste nicken
    body_pose:
      duration_s: 2.0
      torso_pose:
        orientation: {roll: 0.0, pitch: 15.0, yaw: 0.0}
  - say: teste drehen
    body_pose:
      duration_s: 2.0
      torso_pose:
        orientation: {roll: 0.0, pitch: 0.0, yaw: 15.0}
  - say: ausgangsposition
    body_pose:
      duration_s: 2.0
      torso_pose:
        orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
