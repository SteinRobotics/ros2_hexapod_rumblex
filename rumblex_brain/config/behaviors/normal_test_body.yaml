name: normal_test_body
trigger:
  joystick: dpad_horizontal_right
  voice: commandTestBody
actions:
  - RequestTalking: teste x Richtung
    RequestMovementType:
      name: SINGLE_POSE
      duration_s: 2.0
    RequestSinglePose:
      position: {x: 0.05, y: 0.0, z: 0.0}
  - RequestTalking: teste y Richtung
    RequestMovementType:
      name: SINGLE_POSE
      duration_s: 2.0
    RequestSinglePose:
      position: {x: 0.0, y: 0.05, z: 0.0}
  - RequestTalking: teste z Richtung
    RequestMovementType:
      name: SINGLE_POSE
      duration_s: 2.0
    RequestSinglePose:
      position: {x: 0.0, y: 0.0, z: 0.03}
  - RequestTalking: teste rollen
    RequestMovementType:
      name: SINGLE_POSE
      duration_s: 2.0
    RequestSinglePose:
      orientation: {roll: 15.0, pitch: 0.0, yaw: 0.0}
  - RequestTalking: teste nicken
    RequestMovementType:
      name: SINGLE_POSE
      duration_s: 2.0
    RequestSinglePose:
      orientation: {roll: 0.0, pitch: 15.0, yaw: 0.0}
  - RequestTalking: teste drehen
    RequestMovementType:
      name: SINGLE_POSE
      duration_s: 2.0
    RequestSinglePose:
      orientation: {roll: 0.0, pitch: 0.0, yaw: 15.0}
  - RequestTalking: ausgangsposition
    RequestMovementType:
      name: SINGLE_POSE
      duration_s: 2.0
    RequestSinglePose:
      orientation: {roll: 0.0, pitch: 0.0, yaw: 0.0}
