# Presets and anchors for common poses
# Always combine torso and toe_positions OR use leg_angles alone

presets:
  leg_angles_standing: &leg_angles_standing
    all: { torso_coxa: 0.0, coxa_femur: 2.276, femur_tibia: 7.704 }

  toe_positions_standing: &toe_positions_standing
    right_front: { x:  0.201, y:  0.160, z: -0.050 }
    right_mid:   { x:  0.000, y:  0.218, z: -0.050 }
    right_back:  { x: -0.201, y:  0.160, z: -0.050 }
    left_front:  { x:  0.201, y: -0.160, z: -0.050 }
    left_mid:    { x:  0.000, y: -0.218, z: -0.050 }
    left_back:   { x: -0.201, y: -0.160, z: -0.050 }

  leg_angles_laydown: &leg_angles_laydown
    all: { torso_coxa: 0.0, coxa_femur: 70.723, femur_tibia: -53.320 }

  toe_positions_laydown: &toe_positions_laydown
    right_front: { x:  0.180, y:  0.139, z: 0.010 }
    right_mid:   { x:  0.000, y:  0.188, z: 0.010 }
    right_back:  { x: -0.180, y:  0.139, z: 0.010 }
    left_front:  { x:  0.180, y: -0.139, z: 0.010 }
    left_mid:    { x:  0.000, y: -0.188, z: 0.010 }
    left_back:   { x: -0.180, y: -0.139, z: 0.010 }

  head_neutral: &head_neutral
    yaw: 0.0
    pitch: 0.0

  head_look_up: &head_look_up
    yaw: 0.0
    pitch: -20.0

  head_look_left: &head_look_left
    yaw: -30.0
    pitch: 0.0

  head_look_right: &head_look_right
    yaw: 30.0
    pitch: 0.0

  torso_neutral: &torso_neutral
    orientation: { roll: 0.0, pitch: 0.0, yaw: 0.0 }
    direction: { x: 0.0, y: 0.0, z: 0.0 }

# Sequences
EXAMPLE:
  - head: *head_look_left
    torso: *torso_neutral
    duration_factor: 0.5

  - head: *head_neutral
    leg_angles:
      right_front: { torso_coxa: 0.0, coxa_femur: 0.0, femur_tibia: 0.0 }
      left_front: { torso_coxa: 0.0, coxa_femur: 20.0, femur_tibia: -40.0 }
    duration_factor: 0.5

  - head: *head_neutral
    toe_positions:
      right_front: { x: 50.0, y: -50.0, z: 0.0 }
      left_front: { x: 50.0, y: 50.0, z: 0.0 }
    duration_factor: 0.5

  - head: *head_neutral
    leg_angles: *leg_angles_standing
    duration_factor: 0.5

HIGH_FIVE:
  - head: { yaw: 0.0, pitch: -20.0 }
    leg_angles: { right_front: { torso_coxa: 20.0, coxa_femur: 50.0, femur_tibia: 60.0 } }
    duration_factor: 0.33

  - duration_factor: 0.33

  - head: *head_neutral
    leg_angles: *leg_angles_standing
    duration_factor: 0.33

WATCH:
  - head: { yaw: -40.0, pitch: 0.0 }
    duration_factor: 0.25

  - head: { yaw: 0.0, pitch: 0.0 }
    duration_factor: 0.25

  - head: { yaw: 40.0, pitch: 0.0 }
    duration_factor: 0.25

  - head: { yaw: 0.0, pitch: 0.0 }
    duration_factor: 0.25

LOOK_RIGHT:
  - head: *head_look_right
    torso:
      orientation: { roll: 0.0, pitch: 0.0, yaw: 20.0 }
      direction: { x: 0.0, y: 0.0, z: 0.0 }
    duration_factor: 0.33

  - duration_factor: 0.33

  - head: *head_neutral
    torso: *torso_neutral
    duration_factor: 0.33

LOOK_LEFT:
  - head: *head_look_left
    torso:
      orientation: { roll: 0.0, pitch: 0.0, yaw: -20.0 }
      direction: { x: 0.0, y: 0.0, z: 0.0 }
    duration_factor: 0.33

  - duration_factor: 0.33

  - head: *head_neutral
    torso: *torso_neutral
    duration_factor: 0.33

CLAP:
  - head: { yaw: -20.0, pitch: 0.0 }
    torso: *torso_neutral
    duration_factor: 0.33

STAND_UP:
  - head: *head_neutral
    leg_angles: *leg_angles_standing
    duration_factor: 1.0

# STAND_UP:
#   - head: *head_neutral
#     torso: *torso_neutral
#     toe_positions: *toe_positions_standing
#     duration_factor: 1.0

LAYDOWN:
  - head: *head_look_up
    leg_angles: *leg_angles_laydown
    duration_factor: 1.0
